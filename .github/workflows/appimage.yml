name: Linux AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - name: Export Linux game
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release "Linux/X11" build/GD-RPG.x86_64
          test -s build/GD-RPG.x86_64

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/GD-RPG.x86_64 AppDir/usr/bin/gd-rpg
          cat > AppDir/usr/share/applications/gd-rpg.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=GD RPG Engine
          Comment=Pixel-perfect 2D JRPG demo
          Exec=gd-rpg
          Icon=gd-rpg
          Categories=Game;RolePlaying;
          Terminal=false
          EOF
          cat > AppDir/usr/share/icons/hicolor/256x256/apps/gd-rpg.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="28" fill="#17263c"/>
            <path d="M128 24 216 76 216 180 128 232 40 180 40 76Z" fill="#477b45" stroke="#d9bd82" stroke-width="8"/>
            <path d="M128 52 185 86 185 153 128 187 71 153 71 86Z" fill="#286f9a"/>
            <path d="M128 72 153 105 128 142 103 105Z" fill="#7de7f2" stroke="#fff2d4" stroke-width="5"/>
          </svg>
          EOF
          cp AppDir/usr/share/applications/gd-rpg.desktop AppDir/gd-rpg.desktop
          cp AppDir/usr/share/icons/hicolor/256x256/apps/gd-rpg.svg AppDir/gd-rpg.svg

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/gd-rpg \
            --desktop-file AppDir/gd-rpg.desktop \
            --icon-file AppDir/gd-rpg.svg \
            --output appimage
          mv GD_RPG_Engine-x86_64.AppImage GD-RPG-x86_64.AppImage
          chmod +x GD-RPG-x86_64.AppImage
          file GD-RPG-x86_64.AppImage

      - name: Smoke test AppImage
        run: ./GD-RPG-x86_64.AppImage --appimage-extract-and-run --headless --quit-after 5

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gd-rpg-linux-appimage
          path: GD-RPG-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

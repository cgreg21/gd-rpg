name: Visual screenshots

concurrency:
  group: visual-screenshots-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Install screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb imagemagick xdotool

      - name: Import Godot project and register global classes
        run: godot --headless --editor --path . --quit

      - name: Capture 1080p scenes
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            bash scripts/capture-screenshots.sh artifacts/screenshots

      - name: Validate screenshot files
        run: |
          test -s artifacts/screenshots/demo.png
          test -s artifacts/screenshots/demo_crt.png
          test -s artifacts/screenshots/pixel-test.png
          test -s artifacts/screenshots/pixel-test_crt.png
          identify artifacts/screenshots/*.png
          for image in artifacts/screenshots/*.png; do
            test "$(stat -c%s "$image")" -gt 10000 || { echo "Screenshot is unexpectedly small: $image"; exit 1; }
          done
          for scene in demo pixel-test; do
            difference="$(compare -metric AE "artifacts/screenshots/$scene.png" "artifacts/screenshots/${scene}_crt.png" null: 2>&1 || true)"
            awk -v value="$difference" 'BEGIN { if ((value + 0) > 0) exit 0; exit 1; }' || { echo "CRT screenshot is identical to clean screenshot for $scene"; exit 1; }
          done

      - name: Publish screenshots to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/screenshots
          cp artifacts/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: update generated screenshots"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not publish screenshots after 3 attempts"
                exit 1
              fi
            done
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gd-rpg-1080p-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Validate project
        run: godot --headless --editor --path . --quit
      - name: Run world unit tests
        run: godot --headless --path . --script res://tests/test_world.gd
      - name: Run display configuration tests
        run: godot --headless --path . --script res://tests/test_display.gd
      - name: Run playable demo tests
        run: godot --headless --path . --script res://tests/test_demo.gd
      - name: Run ATB system tests
        run: godot --headless --path . --script res://tests/test_atb.gd
      - name: Run inventory system tests
        run: godot --headless --path . --script res://tests/test_inventory.gd
      - name: Run project smoke test
        run: godot --headless --path . --quit-after 5
